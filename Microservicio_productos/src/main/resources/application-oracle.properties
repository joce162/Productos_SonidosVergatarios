# Oracle Autonomous Database (conexión con wallet).
# WALLET_DIR: carpeta donde descomprimiste la wallet (ruta SIN espacios ni tildes).
# El alias sonidosvergatarios_low sale del archivo tnsnames.ora de la wallet.
# Antes de subir el proyecto a GitHub, saca la clave de aquí y pásala por la variable DB_PASSWORD.
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:sonidosvergatarios_low}?TNS_ADMIN=${WALLET_DIR:C:/Wallet_SonidosVergatarios}
spring.datasource.username=${DB_USER:sv_productos}
spring.datasource.password=${DB_PASSWORD:SvProductosClave2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeño: la base Always Free admite pocas sesiones y abrir muchas a la vez puede cerrar conexiones (ORA-03113).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# El driver Oracle imprime trazas detalladas a nivel INFO; solo mostramos errores.
logging.level.oracle.jdbc=ERROR
logging.level.oracle.net=ERROR
