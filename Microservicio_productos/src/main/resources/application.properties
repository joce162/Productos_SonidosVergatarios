spring.application.name=productos
server.port=8082

# Perfil de base de datos: h2 (por defecto, archivo local) o mysql.
# Para MySQL:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.profiles.active=h2

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT (el MISMO secreto debe usarse en login, productos y carrito) ---
app.jwt.secret=${JWT_SECRET:sv-clave-demo-solo-desarrollo-cambiar-en-produccion-123456}
app.jwt.issuer=sonidos-vergatarios
app.jwt.access-minutes=15

# Clave de servicio: la exigen los endpoints /internal/** (no se publican en el Gateway).
app.internal-key=${INTERNAL_KEY:clave-interna-demo-cambiar-en-produccion}

# Datos iniciales (catálogo de ejemplo)
app.seed.catalogo=${SEED_CATALOGO:true}

# Swagger / OpenAPI
app.public-url=${PUBLIC_URL:http://localhost:8080}
springdoc.swagger-ui.path=/swagger-ui.html
